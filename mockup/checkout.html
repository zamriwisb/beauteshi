<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout — Beauté Shi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;0,900;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="app-page concept3 c3-page">
  <div id="t-top"></div>
  <div id="app-bar"></div>

  <main class="app-main" id="checkout-root"></main>

  <div class="app-checkout-bar" id="checkout-bar" hidden></div>

  <div class="confirm-overlay" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-card">
      <div class="confirm-card__icon" id="confirm-icon"></div>
      <h2 id="confirm-title">Order placed</h2>
      <p>Thank you, <span id="confirm-name"></span>. Your order number is</p>
      <p class="order-no" id="confirm-no"></p>
      <p>We'll send updates to <span id="confirm-phone"></span>.</p>
      <a class="btn btn-primary btn-lg btn-block" href="index.html">Continue shopping</a>
    </div>
  </div>

  <div id="t-bottom"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
